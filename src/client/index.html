<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SessionCity</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2f4a2a; }
      body { font: 13px Consolas, "DejaVu Sans Mono", "Courier New", monospace; color: #eee; }
      #app canvas { display: block; image-rendering: pixelated; }
      #hud {
        position: fixed; top: 0; left: 0; right: 0; height: 32px; box-sizing: border-box;
        display: flex; align-items: center; gap: 18px; padding: 0 12px;
        background: #1c1c22; border-bottom: 2px solid #000;
      }
      #hud b { color: #fff; }
      #hud button, .dialog button.go { font: inherit; color: #eee; background: #26262e; border: 1px solid #000; padding: 2px 8px; cursor: pointer; }
      #hud button:hover, .dialog button.go:hover:not(:disabled) { background: #33333e; }
      #hud button[aria-pressed="true"] { background: #6a4a1a; border-color: #ffd23f; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; margin-left: auto; }
      .dot.open { background: #4caf50; }
      .dot.connecting, .dot.closed { background: #f0a030; }
      .dot.auth { background: #e04040; }
      .working { color: #8fd18f; } .waiting { color: #ffd23f; } .idle { color: #9ad0ff; }
      #agents {
        position: fixed; top: 32px; left: 0; bottom: 0; width: 200px; box-sizing: border-box; z-index: 4;
        overflow-y: auto; background: #1c1c22; border-right: 2px solid #000;
      }
      #agents[hidden] { display: none; }
      /* the PR board: bottom-left of the map, clear of the agent column while that is open */
      #prs { position: fixed; left: 8px; bottom: 8px; z-index: 3; width: 300px; max-width: calc(100vw - 16px); box-sizing: border-box; background: #1c1c22; border: 2px solid #000; }
      #agents:not([hidden]) ~ #prs { left: 208px; }
      #prs .bar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
      #prs .bar b { flex: 1; color: #fff; }
      #prs button { font: inherit; color: #eee; background: #26262e; border: 1px solid #000; padding: 1px 8px; cursor: pointer; }
      #prs button:hover:not(:disabled) { background: #33333e; }
      #prs button:disabled { opacity: 0.5; cursor: default; }
      #prs .body { max-height: 40vh; overflow-y: auto; padding: 0 8px 8px; }
      #prs .body { scrollbar-width: auto; scrollbar-color: #5a5a6e #121216; }
      #prs .body::-webkit-scrollbar { width: 16px; }
      #prs .body::-webkit-scrollbar-track { background: #121216; border-left: 1px solid #000; }
      #prs .body::-webkit-scrollbar-thumb { background: #5a5a6e; border: 3px solid #121216; border-radius: 8px; min-height: 40px; }
      #prs .body::-webkit-scrollbar-thumb:hover { background: #7a7a94; }
      #prs.folded .body { display: none; }
      #prs h3 { margin: 6px 0 2px; font-size: 13px; color: #9ad0ff; }
      #prs .msg { margin: 6px 0 0; color: #ffd23f; overflow-wrap: anywhere; }
      #prs .note { margin-top: 4px; color: #aaa; font-size: 11px; }
      #prs .pr { display: block; margin: 2px 0; padding: 3px 6px; font-size: 12px; color: #eee; text-decoration: none; background: #26262e; border: 1px solid #000; overflow-wrap: anywhere; }
      #prs a.pr:hover { background: #33333e; }
      #prs .pr .num { color: #9ad0ff; }
      #prs .pr .meta { margin-top: 3px; font-size: 11px; color: #ccc; }
      #prs .tag { display: inline-block; padding: 0 4px; font-size: 10px; border: 1px solid #000; color: #111; background: #aaa; }
      #prs .tag.none { background: #3a3a44; color: #bbb; }
      #prs .tag.ok { background: #8fd18f; } #prs .tag.bad { background: #ff8a8a; } #prs .tag.wait { background: #ffd23f; } #prs .tag.draft { background: #777; color: #eee; }
      #agents ul { list-style: none; margin: 0; padding: 0; }
      #agents > ul { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; padding: 8px; }
      #agents > ul > li.open { grid-column: 1 / -1; }
      #agents > ul > li.open > .agent-cell { width: calc(50% - 4px); }
      #agents li ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 6px; margin-top: 10px; }
      .agent-cell { position: relative; }
      /* a raised game tile: light top-left bevel, dark bottom-right, a hard drop shadow; it sinks when pressed */
      .agent-row {
        position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        width: 100%; aspect-ratio: 1; box-sizing: border-box; padding: 6px 4px; overflow: hidden;
        font: inherit; font-size: 11px; color: #eee; text-align: center; cursor: pointer;
        background: #3a3a4a; border: 2px solid #000;
        box-shadow: inset 2px 2px 0 #5c5c72, inset -2px -2px 0 #23232d, 0 4px 0 #000;
        transition: transform 60ms, box-shadow 60ms;
      }
      .agent-row:hover { background: #45455a; }
      .agent-row:active { transform: translateY(3px); box-shadow: inset 2px 2px 0 #23232d, inset -2px -2px 0 #5c5c72, 0 1px 0 #000; }
      .agent-row:focus-visible { outline: 2px solid #ffd23f; outline-offset: 2px; }
      .agent-row.sub { font-size: 10px; padding: 4px 3px; background: #30303c; color: #ccc; box-shadow: inset 2px 2px 0 #4a4a5c, inset -2px -2px 0 #1e1e26, 0 3px 0 #000; }
      .agent-row .name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; line-height: 1.2; }
      .agent-row.sub .name { -webkit-line-clamp: 3; }
      .agent-row .ava { flex: none; width: 32px; height: 32px; image-rendering: pixelated; object-fit: contain; }
      .agent-row .st { position: absolute; top: 5px; left: 5px; }
      .summary .sum-head { font-size: 15px; color: #fff; }
      .summary h3 { margin: 12px 0 6px; font-size: 13px; color: #fff; }
      .summary .sum-row { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 4px; padding: 4px 8px; font: inherit; font-size: 12px; text-align: left; color: #eee; background: #2b2b36; border: 2px solid #000; cursor: pointer; }
      .summary .sum-row:hover { background: #3a3a4a; }
      .summary .sum-row img { flex: none; width: 24px; height: 24px; image-rendering: pixelated; object-fit: contain; }
      .summary .sum-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .summary .sum-row small { flex: none; color: #999; }
      .asks .ask { margin-bottom: 10px; padding: 8px 10px; background: #2b2b36; border: 2px solid #000; box-shadow: 0 3px 0 #000; }
      .asks .ask-who { display: flex; align-items: center; gap: 6px; }
      .asks .ask-who img { width: 28px; height: 28px; image-rendering: pixelated; object-fit: contain; }
      .asks .ask-tool { padding: 0 6px; font-size: 11px; color: #000; background: #ffd23f; }
      .asks pre { margin: 6px 0; padding: 6px 8px; max-height: 120px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px Consolas, monospace; background: #15151b; }
      .asks .ask-acts { display: flex; gap: 6px; }
      .asks .ask-err { margin-top: 4px; font-size: 11px; color: #f0a9a9; }
      .agent-row.wt { box-shadow: inset 4px 0 0 #b48cf2, inset 2px 2px 0 #5c5c72, inset -2px -2px 0 #23232d, 0 4px 0 #000; }
      .d-head .wt-tag { font-size: 11px; color: #b48cf2; }
      .agent-row .alert { position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; display: grid; place-items: center; font: bold 11px/1 Consolas, monospace; color: #000; background: #ffd23f; border: 2px solid #000; animation: alert-blink 1.2s steps(1) infinite; }
      .agent-row .alert::after { content: "!"; }
      @keyframes alert-blink { 50% { background: #fff3b0; } }
      .st { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #888; box-shadow: 0 0 0 1px #000; }
      .st.working { background: #8fd18f; } .st.waiting { background: #ffd23f; } .st.idle { background: #9ad0ff; } .st.done { background: #666; }
      .agent-toggle {
        position: absolute; top: 3px; right: 3px; z-index: 1; min-width: 24px; padding: 0 3px;
        font: inherit; font-size: 10px; color: #111; background: #ffd23f; border: 1px solid #000; cursor: pointer;
        box-shadow: inset 1px 1px 0 #fff3a0, 0 2px 0 #000;
      }
      .agent-toggle:active { transform: translateY(1px); box-shadow: 0 1px 0 #000; }
      #hint {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 90vw;
        padding: 10px 16px; background: rgba(20, 20, 26, 0.9); border: 2px solid #000; text-align: center;
      }
      #panel {
        position: fixed; top: 32px; right: 0; bottom: 0; width: 360px; box-sizing: border-box; z-index: 5;
        display: flex; flex-direction: column; background: #1c1c22; border-left: 2px solid #000;
      }
      #panel[hidden], #tooltip[hidden] { display: none; }
      #panel .close { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #eee; font: inherit; font-size: 16px; cursor: pointer; }
      #panel .banner { padding: 6px 12px; background: #5a3a10; color: #ffd23f; }
      #panel .panel-body { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
      #panel h2 { margin: 0 24px 4px 0; font-size: 16px; color: #fff; overflow-wrap: anywhere; }
      #panel h3 { margin: 14px 0 4px; font-size: 12px; color: #9ad0ff; text-transform: uppercase; }
      #panel .meta, #panel .muted { color: #aaa; overflow-wrap: anywhere; }
      #panel pre { margin: 4px 0; padding: 6px; background: #121216; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow-y: auto; font: inherit; }
      #panel .note { color: #f0a030; font-size: 11px; }
      #panel .badge { padding: 0 6px; border: 1px solid currentColor; border-radius: 8px; font-size: 11px; }
      #panel .badge.done { color: #aaa; }
      #panel .tokens { width: 100%; border-collapse: collapse; }
      #panel .tokens th, #panel .tokens td { padding: 1px 4px; text-align: right; }
      #panel .tokens th:first-child { text-align: left; font-weight: normal; overflow-wrap: anywhere; }
      #panel .staff-row, #panel .back { display: block; width: 100%; margin: 2px 0; padding: 4px 6px; text-align: left; font: inherit; color: #eee; background: #26262e; border: 1px solid #000; cursor: pointer; overflow-wrap: anywhere; }
      #panel .back { width: auto; margin-bottom: 8px; }
      #panel .step { font-size: 11px; padding: 1px 0; border-bottom: 1px solid #26262e; }
      #tooltip {
        position: fixed; z-index: 6; max-width: 280px; overflow-wrap: anywhere; padding: 8px 10px; pointer-events: none;
        background: rgba(20, 20, 26, 0.95); border: 2px solid #000;
      }
      #tooltip .dc-present { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
      #tooltip .dc-who { display: inline-flex; align-items: center; gap: 4px; }
      #tooltip .dc-who img { width: 24px; height: 24px; image-rendering: pixelated; object-fit: contain; }
      #tooltip p { margin: 4px 0; } #tooltip ul { margin: 2px 0; padding-left: 18px; }
      .dialog { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.5); }
      .dialog .box { position: relative; box-sizing: border-box; width: 100%; max-width: 420px; max-height: 100vh; overflow-y: auto; padding: 12px 16px 16px; background: #1c1c22; border: 2px solid #000; }
      .dialog .close { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #eee; font: inherit; font-size: 16px; cursor: pointer; }
      .dialog h2 { margin: 0 24px 8px 0; font-size: 16px; color: #fff; }
      .dialog label { display: block; margin: 8px 0 0; color: #9ad0ff; font-size: 12px; }
      .dialog label.check { color: #eee; font-size: 13px; }
      .dialog label select, .dialog label input[type=text], .dialog label textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 2px; font: inherit; color: #eee; background: #121216; border: 1px solid #000; padding: 4px; }
      .dialog label input[type=checkbox] { margin-right: 6px; }
      .dialog .msg { margin: 10px 0 0; min-height: 1em; color: #ffd23f; overflow-wrap: anywhere; }
      .dialog .note { margin-top: 6px; color: #aaa; font-size: 11px; }
      .dialog table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .dialog th, .dialog td { text-align: right; padding: 2px 4px; }
      .dialog th:first-child, .dialog td:first-child { text-align: left; }
      .dialog .row { display: block; width: 100%; text-align: left; margin: 2px 0; font: inherit; font-size: 12px; color: #eee; background: #26262e; border: 1px solid #000; padding: 3px 6px; cursor: pointer; overflow-wrap: anywhere; }
      .dialog .row:hover { background: #33333e; }
      /* department boards: each is drawn its own way */
      .dialog.wide .box { max-width: 680px; }
      .bd-empty { padding: 28px 10px; text-align: center; color: #aaa; }
      .bd .legend, .bd-belt .legend, .bd-lab .legend, .bd-shelf .legend, .bd-wall .legend { margin-top: 10px; font-size: 11px; color: #999; }
      .legend.bad { color: #f0a9a9; }
      /* hộp thư: letters */
      .bd-inbox { display: flex; flex-direction: column; gap: 12px; }
      .bd-inbox .letter { position: relative; padding: 10px 14px 34px; color: #3a2f1f; background: #f3ead2; box-shadow: 0 3px 0 #000, inset 0 0 0 1px #c9b98f; }
      .letter header { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
      .letter time { color: #8a7a5a; font-size: 11px; white-space: nowrap; }
      .letter blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid #c96442; font: 14px/1.5 Georgia, serif; white-space: pre-wrap; max-height: 170px; overflow: auto; }
      .letter footer { font-size: 11px; color: #8a7a5a; }
      .bd-inbox .letter button.go { position: absolute; right: 10px; bottom: 8px; color: #fff; background: #c96442; border-color: #7a3a22; }
      /* phòng khách: armchairs */
      .bd-lounge { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
      .bd-lounge .chair { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 8px 14px; font: inherit; font-size: 12px; color: #f2d8b8; background: #7a3d3d; border: 2px solid #000; border-radius: 16px 16px 4px 4px; box-shadow: inset 0 -12px 0 #5a2a2a, 0 4px 0 #000; cursor: pointer; }
      .bd-lounge .chair:hover { background: #8a4646; }
      .bd-lounge .face { position: relative; }
      .bd-lounge .face img { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; filter: brightness(0.8); }
      .bd-lounge .zzz { position: absolute; top: -8px; right: -22px; font-size: 10px; color: #9ad0ff; animation: bd-float 2.4s ease-in-out infinite; }
      .bd-lounge small { color: #d8b8a0; }
      @keyframes bd-float { 0%, 100% { transform: translateY(2px); opacity: 0.4; } 50% { transform: translateY(-4px); opacity: 1; } }
      /* bản vẽ thi công: a brick wall */
      .bd-wall h3 { margin: 12px 0 6px; font-size: 14px; color: #fff; }
      .bd-wall .plus { color: #6fcf7f; } .bd-wall .minus { color: #e06a6a; }
      .bd-wall .bricks { display: flex; flex-wrap: wrap; gap: 3px; padding: 6px; background: #5a5a62; border: 2px solid #000; }
      .bd-wall .brick { flex: 1 1 58px; min-height: 28px; padding: 4px 6px; box-sizing: border-box; font-size: 10px; color: #111; border: 1px solid #000; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background-image: linear-gradient(rgba(255, 255, 255, 0.22), transparent 60%); }
      .bd-wall .kA { background-color: #6fcf7f; } .bd-wall .kM { background-color: #e0b84a; } .bd-wall .kD { background-color: #e06a6a; } .bd-wall .ku { background-color: #9a9aa6; }
      /* phòng thí nghiệm: a monitor and a rack of test tubes */
      .bd-lab .monitor { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; font-family: Consolas, monospace; background: #06120a; border: 3px solid #3a4a3e; color: #5cff8a; }
      .bd-lab .monitor b { font-size: 26px; letter-spacing: 2px; }
      .bd-lab .monitor.bad { color: #ff6060; } .bd-lab .monitor.run { color: #ffd070; }
      .bd-lab .monitor small { color: #8a9a8e; }
      .bd-lab .rack { display: flex; align-items: flex-end; gap: 9px; margin-top: 10px; padding: 12px 12px 0; background: #2a2f33; border-bottom: 8px solid #5a4a3a; }
      .bd-lab .tube { position: relative; flex: none; width: 18px; height: 72px; border: 2px solid #cfe6ee; border-top: 0; border-radius: 0 0 11px 11px; background: rgba(255, 255, 255, 0.08); }
      .bd-lab .tube i { position: absolute; inset: auto 0 0; height: 72%; border-radius: 0 0 9px 9px; background: #5cff8a; }
      .bd-lab .tube.bad i { background: #ff6060; height: 55%; } .bd-lab .tube.run i { background: #ffd070; height: 40%; animation: bd-bubble 1s ease-in-out infinite alternate; }
      @keyframes bd-bubble { to { height: 60%; } }
      /* dây chuyền: crates on a belt */
      .bd-belt .track { display: flex; align-items: flex-end; gap: 10px; padding: 14px 8px 0; overflow-x: auto; background: #2c2c30; border: 2px solid #000; border-bottom: 0; }
      .bd-belt .crate { flex: none; height: 58px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #222; background: #b8874a; border: 2px solid #000; border-top: 6px solid #6fcf7f; }
      .bd-belt .crate.bad { border-top-color: #e06a6a; } .bd-belt .crate.run { border-top-color: #ffd070; }
      .bd-belt .crate b { font-size: 20px; }
      .bd-belt .wheels { height: 14px; background: repeating-linear-gradient(90deg, #555 0 14px, #2a2a2e 14px 18px); border: 2px solid #000; animation: bd-belt 0.8s linear infinite; }
      @keyframes bd-belt { to { background-position: 18px 0; } }
      /* bảng chuyến bay: a departure board */
      .bd-board { padding: 8px; font-family: Consolas, monospace; background: #0b0b0e; border: 3px solid #333; }
      .bd-board .flight { display: grid; grid-template-columns: 52px 1fr 118px; gap: 8px; padding: 4px 6px; font-size: 12px; color: #ffb020; border-bottom: 1px solid #1d1d22; }
      .bd-board .flight.head { margin-top: 6px; font-size: 10px; color: #777; letter-spacing: 1px; }
      .bd-board .c1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bd-board .go { color: #5cff8a; } .bd-board .hold { color: #ff6060; } .bd-board .air { color: #ffd070; animation: bd-blink 1.2s steps(1) infinite; }
      @keyframes bd-blink { 50% { opacity: 0.35; } }
      /* tháp canh: a green radar feed */
      .bd-radar .sweep { margin-bottom: 6px; font-size: 11px; color: #5cff8a; }
      .bd-radar .sweep::before { content: "\25CF "; animation: bd-blink 1s steps(1) infinite; }
      .bd-radar .feed { max-height: 380px; overflow: auto; padding: 10px; font-family: Consolas, monospace; font-size: 12px; color: #5cff8a; background: #06120a repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, 0.28) 2px 3px); border: 2px solid #1f6a3a; box-shadow: inset 0 0 30px rgba(92, 255, 138, 0.15); }
      .bd-radar .line { padding: 1px 0; overflow-wrap: anywhere; }
      .bd-radar .t { color: #3f9f5a; } .bd-radar .who { color: #ffd070; } .bd-radar .quiet { opacity: 0.6; }
      /* kệ sách: book spines */
      .bd-shelf .books { display: flex; align-items: flex-end; gap: 3px; padding: 10px 10px 0; overflow-x: auto; background: #3a2a1c; border: 2px solid #000; border-bottom: 0; }
      .bd-shelf .book { flex: none; width: 34px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 11px; color: #f2e8d0; border: 1px solid #000; border-radius: 3px 3px 0 0; box-shadow: inset 3px 0 0 rgba(255, 255, 255, 0.15); }
      .bd-shelf .book span { max-height: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; writing-mode: vertical-rl; }
      .bd-shelf .book small { color: #e0d0a8; }
      .bd-shelf .plank { height: 12px; background: #6b4a2e; border: 2px solid #000; border-top: 3px solid #8a6a46; }
      /* bàn vẽ: sheets pinned to a cork board */
      .bd-papers { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; padding: 16px 12px; background: #9a6a42; border: 2px solid #000; }
      .bd-papers .sheet { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px 10px; color: #333; background: #fbfaf3; box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.4); }
      .bd-papers .sheet::before { content: ""; position: absolute; top: -7px; left: 50%; width: 46px; height: 13px; margin-left: -23px; background: rgba(255, 226, 120, 0.75); }
      .bd-papers .t0 { transform: rotate(-1.2deg); } .bd-papers .t1 { transform: rotate(0.9deg); } .bd-papers .t2 { transform: rotate(-0.4deg); }
      .bd-papers small { color: #777; }
      .bd-papers .bar { height: 8px; background: #ddd; border: 1px solid #999; }
      .bd-papers .bar i { display: block; height: 100%; background: #3f9f5a; }
      /* sổ migration: a timeline */
      .bd-ledger h3 { margin: 12px 0 8px; font-size: 14px; color: #fff; }
      .bd-ledger ol { margin: 0 0 8px 8px; padding: 0 0 0 22px; list-style: none; border-left: 3px solid #4a6a8a; }
      .bd-ledger li { position: relative; display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 12px; }
      .bd-ledger li::before { content: ""; position: absolute; top: 8px; left: -31px; width: 9px; height: 9px; background: #1c1c22; border: 3px solid #4a6a8a; border-radius: 50%; }
      .bd-ledger li.fresh::before { background: #ffd23f; border-color: #ffd23f; }
      .bd-ledger small { color: #999; }
      .bd-ledger .tag { padding: 0 6px; font-size: 10px; color: #111; background: #ffd23f; }
