<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BackendCity</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2f4a2a; }
      body { font: 13px Consolas, "DejaVu Sans Mono", "Courier New", monospace; color: #eee; }
      #app canvas { display: block; image-rendering: pixelated; }
      #hud {
        position: fixed; top: 0; left: 0; right: 0; height: 32px; box-sizing: border-box;
        display: flex; align-items: center; gap: 18px; padding: 0 12px;
        background: #1c1c22; border-bottom: 2px solid #000;
      }
      #hud b { color: #fff; }
      #hud button, .dialog button.go { font: inherit; color: #eee; background: #26262e; border: 1px solid #000; padding: 2px 8px; cursor: pointer; }
      #hud button:hover, .dialog button.go:hover:not(:disabled) { background: #33333e; }
      #hud button[aria-pressed="true"] { background: #6a4a1a; border-color: #ffd23f; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; margin-left: auto; }
      .dot.open { background: #4caf50; }
      .dot.connecting, .dot.closed { background: #f0a030; }
      .dot.auth { background: #e04040; }
      .working { color: #8fd18f; } .waiting { color: #ffd23f; } .idle { color: #9ad0ff; }
      #hint {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 90vw;
        padding: 10px 16px; background: rgba(20, 20, 26, 0.9); border: 2px solid #000; text-align: center;
      }
      #panel {
        position: fixed; top: 32px; right: 0; bottom: 0; width: 360px; box-sizing: border-box; z-index: 5;
        display: flex; flex-direction: column; background: #1c1c22; border-left: 2px solid #000;
      }
      #panel[hidden], #tooltip[hidden] { display: none; }
      #panel .close { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #eee; font: inherit; font-size: 16px; cursor: pointer; }
      #panel .banner { padding: 6px 12px; background: #5a3a10; color: #ffd23f; }
      #panel .panel-body { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
      #panel h2 { margin: 0 24px 4px 0; font-size: 16px; color: #fff; overflow-wrap: anywhere; }
      #panel h3 { margin: 14px 0 4px; font-size: 12px; color: #9ad0ff; text-transform: uppercase; }
      #panel .meta, #panel .muted { color: #aaa; overflow-wrap: anywhere; }
      #panel pre { margin: 4px 0; padding: 6px; background: #121216; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow-y: auto; font: inherit; }
      #panel .note { color: #f0a030; font-size: 11px; }
      #panel .badge { padding: 0 6px; border: 1px solid currentColor; border-radius: 8px; font-size: 11px; }
      #panel .badge.done { color: #aaa; }
      #panel .tokens { width: 100%; border-collapse: collapse; }
      #panel .tokens th, #panel .tokens td { padding: 1px 4px; text-align: right; }
      #panel .tokens th:first-child { text-align: left; font-weight: normal; overflow-wrap: anywhere; }
      #panel .staff-row, #panel .back { display: block; width: 100%; margin: 2px 0; padding: 4px 6px; text-align: left; font: inherit; color: #eee; background: #26262e; border: 1px solid #000; cursor: pointer; overflow-wrap: anywhere; }
      #panel .back { width: auto; margin-bottom: 8px; }
      #panel .desktop { margin-top: 6px; padding: 3px 8px; font: inherit; color: #fff; background: #3a5a8a; border: 1px solid #000; cursor: pointer; }
      #panel .desktop:hover { background: #4a6a9a; }
      #panel .step { font-size: 11px; padding: 1px 0; border-bottom: 1px solid #26262e; }
      #panel .chat { display: flex; flex-direction: column; gap: 4px; color: #aaa; }
      #panel .chat-line { max-width: 88%; padding: 4px 8px; border-radius: 8px; background: #26262e; color: #eee; }
      #panel .chat-line.user { align-self: flex-end; background: #1f3a5a; }
      #panel .chat-line .who { font-size: 10px; color: #9ad0ff; }
      #panel .chat-line.claude .who { color: #e0a070; }
      #panel .chat-line .said { font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      #tooltip {
        position: fixed; z-index: 6; max-width: 280px; overflow-wrap: anywhere; padding: 8px 10px; pointer-events: none;
        background: rgba(20, 20, 26, 0.95); border: 2px solid #000;
      }
      #tooltip p { margin: 4px 0; } #tooltip ul { margin: 2px 0; padding-left: 18px; }
      .dialog { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.5); }
      .dialog .box { position: relative; box-sizing: border-box; width: 100%; max-width: 420px; max-height: 100vh; overflow-y: auto; padding: 12px 16px 16px; background: #1c1c22; border: 2px solid #000; }
      .dialog .close { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #eee; font: inherit; font-size: 16px; cursor: pointer; }
      .dialog h2 { margin: 0 24px 8px 0; font-size: 16px; color: #fff; }
      .dialog label { display: block; margin: 8px 0 0; color: #9ad0ff; font-size: 12px; }
      .dialog label.check { color: #eee; font-size: 13px; }
      .dialog label select, .dialog label input[type=text], .dialog label textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 2px; font: inherit; color: #eee; background: #121216; border: 1px solid #000; padding: 4px; }
      .dialog label input[type=checkbox] { margin-right: 6px; }
      .dialog .msg { margin: 10px 0 0; min-height: 1em; color: #ffd23f; overflow-wrap: anywhere; }
      .dialog .note { margin-top: 6px; color: #aaa; font-size: 11px; }
      .dialog table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .dialog th, .dialog td { text-align: right; padding: 2px 4px; }
      .dialog th:first-child, .dialog td:first-child { text-align: left; }
      .dialog .row { display: block; width: 100%; text-align: left; margin: 2px 0; font: inherit; font-size: 12px; color: #eee; background: #26262e; border: 1px solid #000; padding: 3px 6px; cursor: pointer; overflow-wrap: anywhere; }
      .dialog .row:hover { background: #33333e; }
      .dialog h3 { margin: 10px 0 2px; font-size: 13px; color: #9ad0ff; }
      .dialog pre { margin: 6px 0; max-height: 50vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; }
      .dialog button.go { margin-top: 8px; }
      .dialog button.go:disabled { opacity: 0.5; cursor: default; }
      @media (max-width: 599px) { #panel { width: 100%; top: 0; border-left: 0; } }
      .term-overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); }
      .term-box { display: flex; flex-direction: column; width: 80vw; height: 80vh; background: #121216; border: 2px solid #000; }
      .term-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; background: #1c1c22; color: #fff; font-size: 13px; }
      .term-bar .close { background: none; border: 0; color: #eee; font: inherit; font-size: 16px; cursor: pointer; }
      .term-body { flex: 1; min-height: 0; padding: 4px; }
      .chat-overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .chat-box { display: flex; flex-direction: column; width: min(820px, 94vw); height: 86vh; background: #1f1e1d; color: #ece9e1; border: 1px solid #3a3835; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); overflow: hidden; }
      .chat-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid #33312e; font-size: 14px; font-weight: 600; color: #d8d4ca; }
      .chat-bar .close { background: none; border: 0; color: #a8a398; font-size: 16px; cursor: pointer; border-radius: 6px; padding: 2px 8px; }
      .chat-bar .close:hover { background: #33312e; color: #fff; }
      .chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; font-size: 15px; line-height: 1.6; }
      .chat-log .msg { max-width: 88%; overflow-wrap: anywhere; }
      .chat-log .msg.user { align-self: flex-end; white-space: pre-wrap; background: #323029; padding: 10px 16px; border-radius: 18px 18px 4px 18px; }
      .chat-log .msg.claude { align-self: flex-start; padding: 2px 4px; }
      .chat-log .msg.claude > :first-child { margin-top: 0; }
      .chat-log .msg.claude > :last-child { margin-bottom: 0; }
      .chat-log .msg p { margin: 0 0 10px; }
      .chat-log .msg ul, .chat-log .msg ol { margin: 0 0 10px; padding-left: 22px; }
      .chat-log .msg a { color: #d9a27a; }
      .chat-log .msg code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; background: #2b2a27; padding: 1px 5px; border-radius: 5px; }
      .chat-log .msg blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid #4a4741; color: #b9b4a8; }
      .chat-log .code { position: relative; margin: 0 0 10px; }
      .chat-log .code pre { margin: 0; padding: 12px 14px; background: #161514; border: 1px solid #33312e; border-radius: 10px; overflow-x: auto; }
      .chat-log .code pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
      .chat-log .code .copy { position: absolute; top: 6px; right: 6px; background: #2b2a27; color: #b9b4a8; border: 1px solid #3a3835; border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; opacity: 0; transition: opacity 0.15s; }
      .chat-log .code:hover .copy, .chat-log .code .copy:focus { opacity: 1; }
      .chat-log .tool { align-self: flex-start; max-width: 88%; border: 1px solid #3a3835; border-radius: 10px; background: #252421; font-size: 13px; }
      .chat-log .tool summary { cursor: pointer; padding: 7px 12px; display: flex; gap: 8px; align-items: baseline; color: #b9b4a8; list-style: none; }
      .chat-log .tool summary::-webkit-details-marker { display: none; }
      .chat-log .tool summary::before { content: "›"; color: #8a857a; }
      .chat-log .tool[open] summary::before { content: "⌄"; }
      .chat-log .tool .tname { color: #ece9e1; font-weight: 600; }
      .chat-log .tool summary span:last-child { font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chat-log .tool pre { margin: 0; padding: 10px 12px; border-top: 1px solid #33312e; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #c9c4b8; }
      .chat-log .perm { align-self: flex-start; max-width: 88%; border: 1px solid #6b5338; background: #2a241c; border-radius: 12px; padding: 12px 14px; }
      .chat-log .perm .ptool { font-weight: 600; font-size: 13px; color: #e8c9a0; }
      .chat-log .perm pre { margin: 6px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #d8d4ca; }
      .chat-log .perm .acts { display: flex; gap: 8px; align-items: center; }
      .chat-log .perm button { font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 8px; border: 1px solid #4a4741; background: #33312e; color: #ece9e1; cursor: pointer; }
      .chat-log .perm button.allow { background: #c96442; border-color: #c96442; color: #fff; }
      .chat-log .perm button:disabled { opacity: 0.45; cursor: default; }
      .chat-log .perm .status { font-size: 12px; color: #b9b4a8; }
      .chat-log .divider { text-align: center; font-size: 12px; color: #8a857a; margin: 2px 0; }
      .chat-log .foot { font-size: 12px; color: #8a857a; }
      .chat-log .err { font-size: 13px; color: #f08a7e; background: #2f1f1d; border-radius: 8px; padding: 6px 10px; align-self: flex-start; }
      .chat-input { display: flex; gap: 10px; align-items: flex-end; padding: 12px 16px 16px; border-top: 1px solid #33312e; }
      .chat-input textarea { flex: 1; resize: none; max-height: 160px; min-height: 22px; font: inherit; font-size: 15px; color: #ece9e1; background: #2b2a27; border: 1px solid #3f3c37; border-radius: 12px; padding: 10px 14px; outline: none; field-sizing: content; }
      .chat-input textarea:focus { border-color: #c96442; }
      .chat-input textarea:disabled { opacity: 0.5; }
      .chat-send { font: inherit; font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 12px; border: 0; background: #c96442; color: #fff; cursor: pointer; }
      .chat-send:disabled { opacity: 0.45; cursor: default; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" role="status">
      <span>BackendCity</span>
      <button id="btn-back" type="button" hidden>← Về thành phố</button>
      <span id="place-name" hidden></span>
      <span class="working">Đang làm <b id="n-working">0</b></span>
      <span class="waiting">Chờ bạn <b id="n-waiting">0</b></span>
      <span class="idle">Nghỉ <b id="n-idle">0</b></span>
      <button id="btn-launch" type="button">+ Mở phiên</button>
      <button id="btn-rules" type="button">Quy tắc model</button>
      <button id="btn-rock" type="button" aria-pressed="false" title="Bật rồi bấm lên bản đồ để chọi đá người đi đường">🪨 Chọi đá</button>
      <span id="conn" class="dot connecting" title="Đang kết nối…"></span>
    </div>
    <div id="hint" hidden></div>
    <aside id="panel" hidden></aside>
    <div id="tooltip" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
